<div class="notif-bell-wrap">

  <!-- Bell button -->
  <button
    class="notif-bell-btn"
    (click)="toggleDropdown()"
    [attr.aria-label]="titleLabel"
    [attr.aria-expanded]="open">
    <span class="notif-bell-icon">🔔</span>
    @if (unreadCount > 0) {
      <span class="notif-badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
    }
  </button>

  <!-- Dropdown -->
  @if (open) {
    <div class="notif-dropdown" role="dialog" [attr.aria-label]="titleLabel">

      <!-- Header -->
      <div class="notif-dropdown-header">
        <span class="notif-dropdown-title">{{ titleLabel }}</span>
        @if (unreadCount > 0) {
          <button class="notif-mark-all-btn" (click)="markAllAsRead()">
            {{ markAllLabel }}
          </button>
        }
      </div>

      <!-- List -->
      <div class="notif-list">
        @if (notifications.length === 0) {
          <div class="notif-empty">{{ emptyLabel }}</div>
        }
        @for (notif of notifications; track notif.id) {
          <div
            class="notif-item"
            [class.notif-unread]="!notif.read"
            (click)="markAsRead(notif, $event)">
            <span class="notif-type-icon">{{ typeIcon(notif.type) }}</span>
            <div class="notif-content">
              <p class="notif-title">{{ notif.title }}</p>
              <p class="notif-message">{{ notif.message }}</p>
              <p class="notif-time">{{ relativeTime(notif.createdAt) }}</p>
            </div>
            @if (!notif.read) {
              <span class="notif-dot" aria-label="unread"></span>
            }
          </div>
        }
      </div>

    </div>
  }

</div>
