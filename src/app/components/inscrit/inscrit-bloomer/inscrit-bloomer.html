<div class="page-bg">
  <div class="card">

    <div class="logo-row">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" fill="white" width="16" height="16">
          <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 14h-2v-5h2v5zm0-7h-2V7h2v2z"/>
        </svg>
      </div>
      <span class="logo-name">HealthFlow</span>
    </div>

    <div class="step-bar">
      <div class="step done">
        <div class="step-num">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="white" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>Compte
      </div>
      <div class="step-sep"></div>
      <div class="step active"><div class="step-num">2</div>Profil</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">3</div>Terminé</div>
    </div>

    <p class="form-title">Rejoindre HealthFlow</p>
    <p class="form-sub">Créez votre compte et commencez votre parcours bien-être</p>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

    <form (ngSubmit)="register()">

      <p class="sec-label">Informations personnelles</p>
      <div class="grid2">
        <div class="field">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="formData.prenom" name="prenom" placeholder="Prénom" required>
        </div>
        <div class="field">
          <label>Nom</label>
          <input type="text" [(ngModel)]="formData.nom" name="nom" placeholder="Nom" required>
        </div>
      </div>

      <div class="field">
        <label>Adresse e-mail</label>
        <input type="email" [(ngModel)]="formData.email" name="email" placeholder="bloomer@exemple.com" required>
      </div>

      <p class="sec-label">Corps & objectifs</p>
      <div class="grid2">
        <div class="field">
          <label>Âge</label>
          <input type="number" [(ngModel)]="formData.age" name="age" placeholder="25">
        </div>
        <div class="field">
          <label>Taille (cm)</label>
          <input type="number" [(ngModel)]="formData.height" name="height" placeholder="170">
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label>Poids (kg)</label>
          <input type="number" [(ngModel)]="formData.weight" name="weight" placeholder="65">
        </div>
        <div class="field">
          <label>Votre objectif</label>
          <select [(ngModel)]="formData.goal" name="goal">
            <option value="">Sélectionnez votre objectif</option>
            <option value="WEIGHT_LOSS">Perte de poids</option>
            <option value="MUSCLE_GAIN">Prise de masse</option>
            <option value="MAINTAIN">Maintien du poids</option>
            <option value="FITNESS">Améliorer la forme</option>
            <option value="HEALTHY_EATING">Habitudes alimentaires saines</option>
            <option value="ENERGY">Augmenter l'énergie</option>
            <option value="OTHER">Autre</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Niveau d'activité</label>
        <select [(ngModel)]="formData.lifestyleLevel" name="lifestyleLevel">
          <option value="">Sélectionnez votre niveau</option>
          <option value="DEBUTANT">Débutant</option>
          <option value="INTERMEDIAIRE">Intermédiaire</option>
          <option value="DISCIPLINE">Discipliné</option>
          <option value="AVANCE">Avancé</option>
          <option value="EXPERT">Expert</option>
        </select>
      </div>

      <p class="sec-label">Sécurité</p>
      <div class="grid2">
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" [(ngModel)]="formData.pwd" name="pwd" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>Confirmer le mot de passe</label>
          <input type="password" [(ngModel)]="confirmPwd" name="confirmPwd" placeholder="••••••••">
        </div>
      </div>

      <div class="check-row">
        <input type="checkbox" [(ngModel)]="agreed" name="agreed" id="terms-b">
        <label for="terms-b">
          J'accepte les <span class="link">Conditions d'utilisation</span> et la <span class="link">Politique de confidentialité</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!agreed || loading">
        {{ loading ? 'Création du compte...' : 'Créer un compte' }}
      </button>
    </form>

    <p class="login-line">
      Vous avez déjà un compte ?
      <span class="link" [routerLink]="['/authentification','bloomer']">Se connecter</span>
    </p>

  </div>
</div>
